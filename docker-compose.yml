version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ideagen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ideagen_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ideagen_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ideagen} -d ${POSTGRES_DB:-ideagen_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
