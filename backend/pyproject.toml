[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ideagen"
version = "0.1.0"
description = "Evidence-Grounded Research Opportunity Discovery and Evolution Tracking using Deep Learning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "google-genai",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "psycopg2-binary>=2.9.9",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
